<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lindy In Between</title>
  <style>
    :root {
      --paper: #f4efe5;
      --ink: #29251f;
      --muted: #756e63;
      --line: #d8d0c3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    header {
      text-align: center;
      padding: 38px 20px 24px;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      font-size: clamp(38px, 7vw, 76px);
      font-weight: normal;
      margin: 12px 0;
      letter-spacing: -2px;
    }

    header p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin: 0 auto;
      max-width: 460px;
    }

    .desk {
      max-width: 1050px;
      margin: 12px auto 0;
      padding: 24px;
    }

    .desk-surface {
      min-height: 470px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 3px;
      background:
        radial-gradient(ellipse at 20% 25%, #e8ddc9 0%, transparent 45%),
        radial-gradient(ellipse at 80% 75%, #dfd0b8 0%, transparent 50%),
        #e6d9c5;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(3, minmax(105px, auto));
      gap: 12px;
      padding: 28px;
    }

    .object {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 14px;
      min-height: 100px;
      text-decoration: none;
      color: var(--ink);
      box-shadow: 2px 4px 10px #4a38251c;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .object:hover, .object:focus-visible {
      transform: translateY(-4px) rotate(0deg);
      box-shadow: 3px 9px 18px #4a38252b;
    }

    .object span {
      font-size: 19px;
      line-height: 1.25;
    }

    .map {
      grid-column: 1 / 3;
      grid-row: 1 / 3;
      background: #f2e7d1;
      transform: rotate(-4deg);
      border: 1px solid #c9b99e;
    }

    .letter {
      grid-column: 4 / 6;
      grid-row: 1;
      background: #fbf8f0;
      transform: rotate(3deg);
      border: 1px solid #ded5c6;
    }

    .notebook {
      grid-column: 3 / 5;
      grid-row: 2 / 4;
      background: #78806a;
      color: #fffaf0;
      transform: rotate(-2deg);
    }

    .projects {
      grid-column: 5 / 7;
      grid-row: 2;
      background: #c5a78c;
      transform: rotate(4deg);
    }

    .stages {
      grid-column: 1 / 3;
      grid-row: 3;
      background: #e7cfc3;
      transform: rotate(2deg);
    }

    .desk-note {
      grid-column: 5 / 7;
      grid-row: 3;
      align-self: center;
      text-align: center;
      color: #675744;
      font-size: 14px;
      font-style: italic;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 10px 20px 38px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header { padding-top: 28px; }
      .desk { padding: 12px; }
      .desk-surface {
        min-height: 480px;
        padding: 14px;
        gap: 10px;
        grid-template-rows: repeat(3, minmax(115px, auto));
      }
      .object { padding: 8px; }
      .object span { font-size: 16px; }
      .desk-note { font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">A little collection of life</div>
    <h1>Lindy In Between</h1>
    <p>Places, thoughts, things made, letters and all the moments in between.</p>
  </header>

  <main class="desk">
    <div class="desk-surface" aria-label="Choose a section of Lindy In Between">
      <a class="object map" href="index.html"><span>In Between<br>Places</span></a>
      <a class="object letter" href="#letters"><span>In Between<br>Letters</span></a>
      <a class="object notebook" href="#ideas"><span>In Between<br>Ideas</span></a>
      <a class="object projects" href="#projects"><span>In Between<br>Projects</span></a>
      <a class="object stages" href="#stages"><span>In Between<br>Stages</span></a>
      <div class="desk-note">A life, collected<br>along the way.</div>
    </div>
  </main>

  <footer>Made of places, people, and passing moments.</footer>
</body>
</html>
