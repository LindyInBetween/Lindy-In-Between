<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lindy In Between</title>

  <style>
    :root {
      --paper: #f4efe5;
      --ink: #29251f;
      --muted: #756e63;
      --line: #d8d0c3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    header {
      padding: 32px 6vw;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 1.25rem;
      letter-spacing: 0.04em;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10vh 6vw 12vh;
    }

    .intro {
      max-width: 760px;
    }

    .eyebrow {
      margin-bottom: 24px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(3.5rem, 9vw, 8rem);
      font-weight: normal;
      line-height: 0.9;
      letter-spacing: -0.045em;
    }

    .intro p {
      max-width: 600px;
      margin: 0;
      color: var(--muted);
      font-size: 1.3rem;
      line-height: 1.6;
    }

    .map-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 420px;
      margin-top: 10vh;
      border: 1px solid var(--line);
      background: #ebe4d8;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    footer {
      padding: 30px 6vw;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">Lindy In Between</div>
  </header>

  <main>
    <section class="intro">
      <div class="eyebrow">A personal atlas</div>

      <h1>Places I’ve loved.</h1>

      <p>
        Towns, cities, walks, corners and places worth lingering in —
        collected along the way.
      </p>
    </section>

    <section class="map-placeholder">
      The map will live here
    </section>
  </main>

  <footer>
    Lindy In Between
  </footer>

</body>
</html>
