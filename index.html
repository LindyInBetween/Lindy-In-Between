```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lindy In Between</title>

  <!-- Leaflet map library -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    :root {
      --paper: #f4efe5;
      --ink: #29251f;
      --muted: #756e63;
      --line: #d8d0c3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    header {
      padding: 32px 6vw;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 1.25rem;
      letter-spacing: 0.04em;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 10vh 6vw 12vh;
    }

    .intro {
      max-width: 760px;
    }

    .eyebrow {
      margin-bottom: 24px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(3.5rem, 9vw, 8rem);
      font-weight: normal;
      line-height: 0.9;
      letter-spacing: -0.045em;
    }

    .intro p {
      max-width: 600px;
      margin: 0;
      color: var(--muted);
      font-size: 1.3rem;
      line-height: 1.6;
    }

    #map {
      width: 100%;
      height: 560px;
      margin-top: 10vh;
      border: 1px solid var(--line);
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: var(--paper);
    }

    .popup-title {
      margin: 0 0 5px;
      font-size: 1.3rem;
      font-weight: normal;
    }

    .popup-country {
      margin: 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    footer {
      padding: 30px 6vw;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
    }

    @media (max-width: 600px) {
      header {
        padding: 24px 5vw;
      }

      main {
        padding: 8vh 5vw 10vh;
      }

      #map {
        height: 420px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">Lindy In Between</div>
  </header>

  <main>

    <section class="intro">
      <div class="eyebrow">A personal atlas</div>

      <h1>Places I’ve loved.</h1>

      <p>
        Towns, cities, walks, corners and places worth lingering in —
        collected along the way.
      </p>
    </section>

    <div id="map"></div>

  </main>

  <footer>
    Lindy In Between
  </footer>

  <!-- Leaflet map library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Create the map.
    const map = L.map('map').setView([52.5, -2.5], 6);

    // Add the OpenStreetMap background.
    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);

    // Our first three Lindy In Between destinations.
    const places = [
      {
        name: 'Merthyr Tydfil',
        country: 'Wales, UK',
        coordinates: [51.7460, -3.3777]
      },
      {
        name: 'Southampton',
        country: 'England, UK',
        coordinates: [50.9097, -1.4044]
      },
      {
        name: 'Preston',
        country: 'England, UK',
        coordinates: [53.7632, -2.7031]
      }
    ];

    // Add one pin for each destination.
    places.forEach(place => {

      const popup = `
        <h3 class="popup-title">${place.name}</h3>
        <p class="popup-country">${place.country}</p>
      `;

      L.marker(place.coordinates)
        .addTo(map)
        .bindPopup(popup);
    });
  </script>

</body>
</html>
```
